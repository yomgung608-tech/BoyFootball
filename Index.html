<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Schedule</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #07111f;
  color: white;
  padding-bottom: 85px;
}

header {
  padding: 22px 18px;
  background: #10243a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #4ade80;
  font-size: 22px;
  font-weight: bold;
}

.hero {
  padding: 25px 18px;
  background: linear-gradient(135deg,#123d2b,#10243a);
}

.hero h1 {
  font-size: 25px;
  margin-bottom: 8px;
}

.hero p {
  color: #b8c9d8;
  font-size: 13px;
}

.search {
  padding: 15px 18px;
}

.search input {
  width: 100%;
  padding: 13px;
  border: 1px solid #29435c;
  background: #13243a;
  color: white;
  border-radius: 10px;
  outline: none;
}

.tabs {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding: 5px 18px 15px;
}

.tabs button {
  border: none;
  padding: 10px 17px;
  border-radius: 20px;
  background: #1b3047;
  color: white;
  white-space: nowrap;
  cursor: pointer;
}

.tabs button.active {
  background: #16a34a;
}

.section {
  padding: 10px 18px;
}

.section h3 {
  margin-bottom: 15px;
}

.match {
  background: #13243a;
  border: 1px solid #263c52;
  border-radius: 13px;
  padding: 16px;
  margin-bottom: 13px;
}

.league {
  color: #4ade80;
  font-size: 12px;
  margin-bottom: 14px;
  font-weight: bold;
}

.teams {
  display: flex;
  justify-content: space-between;
  align-items: center;
  text-align: center;
}

.team {
  width: 38%;
  font-weight: bold;
  font-size: 14px;
}

.vs {
  color: #4ade80;
  font-size: 17px;
  font-weight: bold;
}

.time {
  text-align: center;
  color: #a8b8c8;
  font-size: 12px;
  margin-top: 14px;
}

.favorite {
  border: none;
  background: transparent;
  color: #facc15;
  font-size: 20px;
  cursor: pointer;
  float: right;
}

.empty {
  text-align: center;
  padding: 30px;
  color: #94a3b8;
}

nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: space-around;
  background: #10243a;
  padding: 15px 5px;
  border-top: 1px solid #29435c;
}

nav button {
  background: none;
  border: none;
  color: #a8b8c8;
  font-size: 12px;
  cursor: pointer;
}

nav button.active {
  color: #4ade80;
}
</style>
</head>

<body>

<header>
  <div class="logo">⚽ FOOTBALL</div>
  <div>🏆 2026/27</div>
</header>

<div class="hero">
  <h1>Football Center</h1>
  <p>Semua jadwal pertandingan sepak bola dalam satu aplikasi.</p>
</div>

<div class="search">
  <input id="search"
    placeholder="Cari klub atau liga..."
    oninput="renderMatches()">
</div>

<div class="tabs" id="filters">
  <button class="active" onclick="setLeague('Semua',this)">Semua</button>
  <button onclick="setLeague('Premier League',this)">Premier League</button>
  <button onclick="setLeague('La Liga',this)">La Liga</button>
  <button onclick="setLeague('Serie A',this)">Serie A</button>
  <button onclick="setLeague('Champions League',this)">UCL</button>
  <button onclick="setLeague('Liga Indonesia',this)">Indonesia</button>
</div>

<div class="section">
  <h3 id="heading">📅 Jadwal Pertandingan</h3>
  <div id="matches"></div>
</div>

<nav>
  <button class="active" onclick="setPage('Semua',this)">🏠<br>Home</button>
  <button onclick="setPage('Jadwal',this)">📅<br>Jadwal</button>
  <button onclick="setPage('Live',this)">🔴<br>Live</button>
  <button onclick="setPage('Favorit',this)">⭐<br>Favorit</button>
</nav>

<script>

// DATA PERTANDINGAN CONTOH
const matches = [
 {
  league:"Premier League",
  home:"Arsenal",
  away:"Chelsea",
  date:"2026-11-17",
  time:"20:00",
  status:"scheduled"
 },
 {
  league:"La Liga",
  home:"Barcelona",
  away:"Real Madrid",
  date:"2026-11-17",
  time:"22:00",
  status:"scheduled"
 },
 {
  league:"Serie A",
  home:"AC Milan",
  away:"Inter Milan",
  date:"2026-11-18",
  time:"23:30",
  status:"scheduled"
 },
 {
  league:"Champions League",
  home:"Liverpool",
  away:"Bayern Munich",
  date:"2026-11-19",
  time:"02:00",
  status:"scheduled"
 },
 {
  league:"Liga Indonesia",
  home:"Persib Bandung",
  away:"Persija Jakarta",
  date:"2026-11-20",
  time:"19:00",
  status:"scheduled"
 },
 {
  league:"Premier League",
  home:"Manchester City",
  away:"Manchester United",
  date:"2026-11-21",
  time:"21:00",
  status:"scheduled"
 }
];

let selectedLeague = "Semua";
let currentPage = "Semua";
let favorites = JSON.parse(
 localStorage.getItem("favorites") || "[]"
);

function setLeague(league,button) {
 selectedLeague = league;

 document.querySelectorAll("#filters button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");
 renderMatches();
}

function setPage(page,button) {
 currentPage = page;

 document.querySelectorAll("nav button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 document.getElementById("heading").innerText =
 page === "Live" ? "🔴 Pertandingan Live" :
 page === "Favorit" ? "⭐ Klub Favorit" :
 page === "Jadwal" ? "📅 Semua Jadwal" :
 "⚽ Jadwal Pertandingan";

 renderMatches();
}

function toggleFavorite(team) {
 if(favorites.includes(team)) {
   favorites = favorites.filter(x=>x!==team);
 } else {
   favorites.push(team);
 }

 localStorage.setItem(
   "favorites",
   JSON.stringify(favorites)
 );

 renderMatches();
}

function renderMatches() {
 const container =
 document.getElementById("matches");

 const keyword =
 document.getElementById("search")
 .value.toLowerCase();

 let data = matches.filter(m => {
   const text =
   (m.home + " " + m.away + " " + m.league)
   .toLowerCase();

   const leagueMatch =
   selectedLeague === "Semua" ||
   selectedLeague === m.league;

   const searchMatch =
   text.includes(keyword);

   const favoriteMatch =
   currentPage !== "Favorit" ||
   favorites.includes(m.home) ||
   favorites.includes(m.away);

   const liveMatch =
   currentPage !== "Live" ||
   m.status === "live";

   return leagueMatch &&
   searchMatch &&
   favoriteMatch &&
   liveMatch;
 });

 if(data.length === 0) {
   container.innerHTML =
   '<div class="empty">Tidak ada pertandingan ditemukan.</div>';
   return;
 }

 container.innerHTML = data.map(m => {
   const isFavorite =
   favorites.includes(m.home);

   return `
   <div class="match">

     <button class="favorite"
       onclick="toggleFavorite('${m.home}')">
       ${isFavorite ? "★" : "☆"}
     </button>

     <div class="league">${m.league}</div>

     <div class="teams">
       <div class="team">${m.home}</div>
       <div class="vs">VS</div>
       <div class="team">${m.away}</div>
     </div>

     <div class="time">
       📅 ${m.date} &nbsp; ⏰ ${m.time} WIB
     </div>

   </div>
   `;
 }).join("");
}

renderMatches();

</script>
</body>
</html>
